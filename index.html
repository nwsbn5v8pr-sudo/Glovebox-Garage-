<style>
/* Layout: one narrow column like a phone app; a dashboard of vehicle cards, a detail screen, and bottom sheets for forms */
:root{

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e8edf2; --muted:#9aa8b6; --line:#2a3542;
  --brand:#0b1117; --accent:#f5c22e; --accent-ink:#141a20;
  --ok:#5fd39a; --ok-bg:#16352a; --soon:#f2c14e; --soon-bg:#3a2e10; --late:#ff8a7a; --late-bg:#41201c;
  --track:#26313d; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e8edf2; --muted:#9aa8b6; --line:#2a3542;

  --ok:#5fd39a; --ok-bg:#16352a; --soon:#f2c14e; --soon-bg:#3a2e10; --late:#ff8a7a; --late-bg:#41201c;
  --track:#26313d; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.bar h1{font:700 26px/1 var(--display);letter-spacing:.3px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bar h1 small{display:block;font:500 12px/1.3 var(--body);letter-spacing:.6px;opacity:.75;text-transform:uppercase;margin-bottom:3px}
.icon-btn{border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

/* the Settings button wears the app icon: an amber service light glowing on a black display, in every look */
.bar #gearBtn{background:radial-gradient(circle at 50% 45%,#1c1f26,#07080b);color:#ffb21a;border:1px solid rgba(255,178,26,.35);border-radius:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.35);filter:none}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:14px}

.note{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soon-bg);color:var(--ink)}
.note p{margin:0;flex:1;min-width:180px}
.link-btn{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;color:inherit}

.summary{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
button.card{cursor:pointer}
button.card:active{transform:scale(.99)}
.card-top{display:flex;align-items:flex-start;gap:12px}
.card-top>div{flex:1;min-width:0}
.v-name{font:700 22px/1.1 var(--display);margin:0;letter-spacing:.2px;overflow-wrap:anywhere}
.v-sub{font-size:13px;color:var(--muted);margin-top:3px}
.pill{flex:none;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}

.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.due-box .left{font-size:13px;font-weight:600;margin-top:2px}
.left.ok{color:var(--ok)}.left.soon{color:var(--soon)}.left.late{color:var(--late)}.left.none{color:var(--muted)}

.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.soon i{background:var(--soon)}.meter.late i{background:var(--late)}
.meter-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:8px}

.empty{text-align:center;padding:36px 20px;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:15px 24px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100% - 32px)}
.fab svg{width:20px;height:20px}

/* detail */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late);border-color:var(--late-bg);background:var(--late-bg)}
.btn.block{width:100%}
.section-h{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 -4px;color:var(--muted)}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hist-row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row>div{flex:1;min-width:0}
.hist-date{font-weight:700}
.hist-meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hist-del{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;flex:none}
.hist-del svg{width:18px;height:18px}
.svc-h{font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.3px;margin:0;display:flex;align-items:center;gap:8px}
.svc-h svg{width:20px;height:20px;color:var(--muted)}
.mini-list{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--bg);border-radius:10px;padding:9px 12px}
.mini-l{font-weight:600;font-size:14px}
.mini .left{font-size:14px;font-weight:700;margin:0;text-align:right}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.rem-row{padding:13px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rem-row:first-child{border-top:0}
.rem-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rem-name{font-weight:700;flex:1;min-width:0;cursor:pointer}
.rem-every{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rem-every input,.rem-every select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;min-width:0}
.rem-every input{width:96px}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.switch,.switch::after{transition:none}}
.own{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:var(--track);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.add-own{display:flex;gap:10px}
.add-own input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px}
.add-own .btn{flex:none;padding-inline:20px}
.note-btns{display:flex;gap:16px}
.safe-val{flex:none;font-size:14px;white-space:nowrap}
.safe-val.ok{color:var(--ok)}.safe-val.late{color:var(--late)}
.paste summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);padding:6px 0}
.paste-in{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.odo-row{display:flex;flex-wrap:nowrap;gap:12px;align-items:flex-start;justify-content:space-between}
.odo-col{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.hero .odo-row .odo{gap:6px;flex-wrap:nowrap}
.hero .odo-row .odo-digits span{font-size:21px;min-width:17px;padding:5px 2px}
.hero .odo-row .odo-plain{font-size:38px}
.hero .odo-row .odo-unit{font-size:13px}
.reg{flex:none;align-items:flex-start}
@media (max-width:350px){.odo-row{flex-wrap:wrap}}
.odo-col .hint{margin:0}
.reg{display:flex;flex-direction:column;gap:4px;min-width:0}
.reg .left{font-size:12px;font-weight:700}
.reg-exp{font-size:12px;color:var(--muted)}
/* a license plate is a physical object, so it keeps plate colors in every look */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fbfbf7;color:#1c2333;border:2px solid #1c2333;border-radius:8px;
  padding:3px 10px 5px;box-shadow:inset 0 0 0 2px #fbfbf7,inset 0 0 0 3px #9aa3b5;min-width:104px}
.plate-state{font:700 9px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#a3262a;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-no{font:700 22px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;font-style:normal}
.reg-add{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:10px 14px;font-weight:600;color:var(--muted)}
.sub-lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.vin-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vin{font:600 17px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;overflow-wrap:anywhere}
.btn.small{padding:8px 14px;font-size:13px;flex:none;width:auto}
.btn[disabled]{opacity:.55;cursor:default}
a.btn{text-decoration:none;color:inherit;display:block}
.specs{margin:0;display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.specs dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.specs dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}
.recalls{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.rc-h{margin:0;font-size:17px}
.rc-list summary{cursor:pointer;font-weight:700;padding:4px 0}
.rc-item{padding:10px 0;border-top:1px solid var(--line)}
.rc-item p{margin:6px 0 0;font-size:14px;line-height:1.45}
.rc-comp{font-weight:700}
.warn-txt{color:var(--soon)}
.tag{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--track);color:var(--muted)}
.tag.oil{background:var(--soon-bg);color:var(--soon)}
.tag svg{width:17px;height:17px}
.last-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.last-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
.last-box .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.last-date{font:700 19px/1.2 var(--display);margin-top:2px}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.settings-row:first-child{border-top:0}
.settings-row span{font-size:13px;color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sheet h2{font:700 26px var(--display);margin:0;text-transform:uppercase;letter-spacing:.3px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px;width:100%;min-width:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.ymm{display:grid;grid-template-columns:minmax(96px,2fr) 3fr;gap:10px}
.ymm>*{min-width:0}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px}
.preset[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:0}
.preview{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:15px}
.preview b{font-family:var(--display);font-size:20px}
.err{color:var(--late);font-size:14px;font-weight:600;margin:0}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
textarea{resize:vertical;min-height:70px}

.field .check{font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.field .check input{width:20px;height:20px;padding:0;flex:none;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* ===== Classic '50s look: service-station signage, diner checkerboard, cherry red and turquoise, chrome trim.
   Night version is a drive-in after dark: deep teal with neon trim. ===== */
:root[data-style="classic"]{
  --bg:#f3e6c8; --surface:#fffaf0; --ink:#2a211c; --muted:#6f5e4f; --line:#d9c7a3;
  --brand:#c62b2b; --accent:#34b3a8; --accent-ink:#13302d;
  --ok:#2e7d4f; --ok-bg:#dcefdc; --soon:#9a5b00; --soon-bg:#fbe3a7; --late:#b3261e; --late-bg:#f9d6cf;
  --track:#eadbbb; --scrim:rgba(42,33,28,.5);
  --display:"Righteous","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --chrome:linear-gradient(180deg,#ffffff 0%,#c9ced3 45%,#8d959c 55%,#e6e9ec 100%);
  --check-a:#2a211c; --check-b:#fffaf0; --hard:#2a211c;
}
@media (prefers-color-scheme:dark){:root[data-style="classic"]:not([data-theme="light"]){
  --bg:#0f2427; --surface:#163236; --ink:#f6ead2; --muted:#a9c4bf; --line:#2b4c50;
  --brand:#8f1d2c; --accent:#ff6f91; --accent-ink:#2a0c14;
  --ok:#6be0b0; --ok-bg:#163d35; --soon:#ffd166; --soon-bg:#3d3214; --late:#ff8a7a; --late-bg:#47201c;
  --track:#24454a; --scrim:rgba(0,0,0,.6);
  --check-a:#0a1719; --check-b:#5ee0d2; --hard:#5ee0d2; color-scheme:dark}}
:root[data-style="classic"][data-theme="dark"]{
  --bg:#0f2427; --surface:#163236; --ink:#f6ead2; --muted:#a9c4bf; --line:#2b4c50;
  --brand:#8f1d2c; --accent:#ff6f91; --accent-ink:#2a0c14;
  --ok:#6be0b0; --ok-bg:#163d35; --soon:#ffd166; --soon-bg:#3d3214; --late:#ff8a7a; --late-bg:#47201c;
  --track:#24454a; --scrim:rgba(0,0,0,.6);
  --check-a:#0a1719; --check-b:#5ee0d2; --hard:#5ee0d2; color-scheme:dark}

[data-style="classic"] .bar{padding-bottom:26px;background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 100%/16px 16px repeat-x,var(--brand)}
[data-style="classic"] .bar::after{content:"";position:absolute;left:0;right:0;bottom:16px;height:4px;background:var(--chrome)}
[data-style="classic"] .bar h1{font:400 34px/1.05 var(--script);text-transform:none;letter-spacing:.5px;color:#fff6e2;text-shadow:2px 2px 0 rgba(0,0,0,.25);padding-bottom:2px}
[data-style="classic"] .bar h1 small{font:400 12px/1.3 var(--display);letter-spacing:2px;opacity:.9;color:#fff6e2}
[data-style="classic"] .icon-btn{background:var(--chrome);color:#2a211c;border:1px solid rgba(0,0,0,.25);border-radius:50%}
[data-style="classic"] .card,[data-style="classic"] .hero,[data-style="classic"] .hist,[data-style="classic"] .last-box{border:2px solid var(--hard);border-radius:14px;box-shadow:4px 4px 0 var(--accent)}
[data-style="classic"] .v-name,[data-style="classic"] .svc-h,[data-style="classic"] .sheet h2,[data-style="classic"] .empty h2{font-family:var(--display);font-weight:400;text-transform:none;letter-spacing:.3px}

// next due by mileage or date, whichever comes first
function calc(last,iMiles,iMonths,cur){
  if(!last)return {state:"none"};
  var lastDate=parse(last.date),dueDate=addMonths(lastDate,iMonths),hasMiles=last.miles!=null&&!!iMiles;
  var dueMiles=hasMiles?last.miles+iMiles:null,milesLeft=hasMiles?dueMiles-cur:null,daysLeft=daysBetween(today(),dueDate);
  var totalDays=Math.max(1,daysBetween(lastDate,dueDate));
  var usedM=hasMiles?(cur-last.miles)/iMiles:0,usedD=(totalDays-daysLeft)/totalDays;
  var soonMiles=Math.max(300,Math.round(iMiles*0.1));
  var state=((hasMiles&&milesLeft<=0)||daysLeft<=0)?"late":((hasMiles&&milesLeft<=soonMiles)||daysLeft<=30)?"soon":"ok";
  return {state:state,last:last,dueDate:dueDate,dueMiles:dueMiles,milesLeft:milesLeft,daysLeft:daysLeft,cur:cur,iMiles:iMiles,
    used:Math.max(0,Math.min(1,Math.max(usedM,usedD)))};
}

// the registration shown like a license plate, with its renewal status underneath
// VIN, decoded details and recalls
function detailsCard(v){
  var h='<h2 class="section-h">Vehicle details</h2><section class="hero details">';
  if(!v.vin)return h+'<p class="hint">Add the VIN to look up the engine, trim and drivetrain, and check for safety recalls. It\'s on the driver\'s side of the dashboard, inside the driver\'s door frame and on your registration and insurance card.</p>'+
    '<button class="btn block" type="button" id="vinAdd">+ Add VIN</button></section>';
  var st=vinStatus(v.vin);
  h+='<div class="vin-row"><div><div class="odo-label">VIN</div><div class="vin">'+esc(v.vin)+'</div></div><button class="btn small" type="button" id="vinCopy">Copy</button></div>';
  if(st!=="ok")h+='<p class="hint warn-txt">'+(st==="check"?"This VIN doesn\'t pass the check-digit test, so a character may be mistyped. Double-check it against the car.":"A VIN has 17 letters and numbers, and never uses I, O or Q. Check it with the edit button.")+'</p>';
  var sp=v.specs;
  if(sp){
    var rows=[["Vehicle",[sp.year,sp.make,sp.model,sp.trim].filter(Boolean).join(" ")],["Engine",[sp.engine,sp.fuel].filter(Boolean).join(" · ")],["Drive",sp.drive],["Transmission",sp.trans],["Body",sp.body],["Built in",sp.built],["Weight class",sp.gvwr]];
    h+='<dl class="specs">'+rows.filter(function(r){return r[1]}).map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd></div>'}).join("")+'</dl>';
  }else{
    var y=st==="ok"?vinYear(v.vin):null;
    h+='<p class="hint">'+(y?'Model year '+y+' (from the VIN). ':'')+'Look up the details to see the engine, trim, drivetrain and recalls. Only the VIN is sent, to the U.S. government\'s free NHTSA vehicle database.</p>';
  }
  h+='<button class="btn'+(sp?'':' primary')+' block" type="button" id="vinLookup"'+(st==="letters"||st==="short"?" disabled":"")+'>'+(sp?'Look up again':'Look up vehicle details')+'</button>';
  if(sp){
    var rc=v.recalls,fresh=rc&&rc.key===[sp.make,sp.model,sp.year].join("|").toUpperCase();
    h+='<div class="recalls"><div class="card-top"><div><h3 class="rc-h">Safety recalls</h3>'+
      (fresh?'<div class="hist-meta">'+rc.count+' recall'+(rc.count===1?'':'s')+' for the '+esc(sp.year+' '+sp.make+' '+sp.model)+' · checked '+esc(timeAgo(rc.checked))+'</div>':'<div class="hist-meta">Not checked yet</div>')+
      '</div>'+(fresh?'<span class="pill '+(rc.count?'soon':'ok')+'">'+(rc.count?rc.count+' found':'None')+'</span>':'')+'</div>';
    if(fresh&&rc.count){
      h+='<details class="rc-list"><summary>Show recalls</summary>'+rc.items.map(function(x){
        return '<div class="rc-item"><div class="rc-comp">'+esc(x.component)+'</div><div class="hist-meta">'+(x.date?esc(fmtDate(parse(x.date)))+' · ':'')+'Campaign '+esc(x.id)+'</div><p>'+esc(x.summary)+'</p></div>'}).join("")+'</details>';
    }
    h+='<p class="hint">These are recalls for every '+esc(sp.year+' '+sp.make+' '+sp.model)+'. To see whether any are still open on your car, check your VIN on nhtsa.gov or ask a dealer. Recall repairs are free.</p>'+
      '<div class="row-btns"><button class="btn" type="button" id="rcCheck">'+(fresh?'Check again':'Check recalls')+'</button>'+
      '<a class="btn" href="https://www.nhtsa.gov/recalls?vin='+encodeURIComponent(v.vin)+'" target="_blank" rel="noopener">Check my VIN</a></div></div>';
  }
  return h+'</section>';
}
function regTile(v){
  var r=v.reg||{};
  if(!r.number&&!r.expires)return '<button class="reg-add" type="button" id="regAdd">+ Add registration</button>';
  var rs=regStatus(v);
  return '<div class="reg"><div class="odo-label">Registration</div>'+
    '<div class="plate" aria-label="Registration '+esc(r.number||"not entered")+(r.state?", "+esc(r.state):"")+'">'+
      '<span class="plate-state">'+esc(r.state||"Registration")+'</span><span class="plate-no">'+esc(r.number||"—")+'</span></div>'+
    (r.expires?'<div class="reg-exp">Expires '+esc(fmtDate(rs.expires))+'</div><div class="left '+rs.state+'">'+regText(rs)+'</div>':'<div class="reg-exp">Add the expiry date to get a reminder</div>')+
  '</div>';
}
function odometer(n){
  var s=String(Math.max(0,Math.round(n)));while(s.length<6)s="0"+s;
  return '<span class="odo-digits" aria-label="'+num(n)+' '+unit()+'">'+s.split("").map(function(c){return "<span>"+c+"</span>"}).join("")+'</span>'+
    '<span class="odo-plain" aria-hidden="true">'+num(n)+'</span>';
}

var MAKE_NAMES=Object.keys(CAR_MAKES).sort(function(a,b){return a.localeCompare(b)});
var modelCache={};
function makeModels(make){return CAR_MAKES[make]?CAR_MAKES[make].split(","):[]}
// Splits an older name like "2019 Honda CR-V" into its year, make and model
function splitName(name){
  var m=/^\s*((?:19|20)\d\d)\s+(.+)$/.exec(name||""),out={year:"",make:"",model:""};if(!m)return out;
  var rest=m[2],best="";
  MAKE_NAMES.concat(["Chevy","VW","Mercedes"]).forEach(function(mk){if(rest.toLowerCase().indexOf(mk.toLowerCase()+" ")===0&&mk.length>best.length)best=mk});
  if(!best)return out;
  var make={Chevy:"Chevrolet",VW:"Volkswagen",Mercedes:"Mercedes-Benz"}[best]||best,model=rest.slice(best.length).trim();
  return {year:m[1],make:make,model:model};
}
// NHTSA's model list for one make and year (free, no key). Quietly skipped offline.
function onlineModels(make,year){
  var k=make+"|"+year;
  if(modelCache[k])return Promise.resolve(modelCache[k]);
  if(!year||!make||inViewer()||navigator.onLine===false)return Promise.resolve([]);
  return fetchJson("https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/"+encodeURIComponent(make)+"/modelyear/"+year+"?format=json").then(function(j){
    var seen={},list=(j&&j.Results||[]).map(function(r){return cleanStr(r&&r.Model_Name,60)}).filter(function(x){var l=x.toLowerCase();if(!x||seen[l])return false;seen[l]=1;return true});
    return (modelCache[k]=list);
  },function(){return []});
}

    '<div class="field"><span class="lbl">Change oil every</span><div class="two"><input id="vInt" inputmode="numeric" aria-label="Interval in '+unit()+'" value="'+num(im)+'"><select id="vMon" aria-label="Interval in months">'+
      [3,4,6,9,12].map(function(m){return '<option value="'+m+'"'+(m===imo?" selected":"")+'>'+m+' months</option>'}).join("")+'</select></div>'+
      '<div class="presets" id="intPresets">'+milePresets.map(function(p){return '<button class="preset" type="button" data-int="'+p+'" aria-pressed="'+(p===im)+'">'+num(p)+' '+unit()+'</button>'}).join("")+'</div>'+
      '<p class="hint">Whichever comes first. Check your owner\'s manual if you\'re not sure. Many newer cars with synthetic oil use 7,500 to 10,000 miles.</p></div>';
  if(isNew){
    if(data.reminders["Tire rotation"].on)h+='<div class="field"><span class="lbl">Last tire rotation (optional)</span><div class="two"><input id="vRotDate" type="date" aria-label="Date of last tire rotation" max="'+iso(today())+'"><input id="vRotMiles" inputmode="numeric" aria-label="Mileage at last tire rotation" placeholder="Mileage"></div></div>';
    h+='<div class="field"><span class="lbl">Last oil change (optional)</span><div class="two"><input id="vLastDate" type="date" aria-label="Date of last oil change" max="'+iso(today())+'"><input id="vLastMiles" inputmode="numeric" aria-label="Mileage at last oil change" placeholder="Mileage"></div></div>';
  }
  h+='<p class="err" id="vErr" hidden></p>'+
    '<div class="sheet-btns"><button class="btn" type="button" id="vCancel">Cancel</button><button class="btn primary" type="submit">'+(isNew?"Add vehicle":"Save")+'</button></div>'+
    (isNew?'':'<button class="btn danger block" type="button" id="vDelete">Delete vehicle</button>')+
    '</div></form>';
  openSheet(h,function(){
    $("vCancel").onclick=closeSheet;
    function vinHint(){
      var x=vinClean($("vVin").value),st=vinStatus(x),h=$("vinHint");
      h.className="hint"+(st&&st!=="ok"?" warn-txt":"");
      h.textContent=!x?"Find it on the driver's side of the dashboard, in the driver's door frame or on your registration."
        :st==="ok"?"Looks right"+(vinYear(x)?": a "+vinYear(x)+" model year vehicle.":".")
        :st==="letters"?"VINs never use the letters I, O or Q. Check for a 1 or 0."
        :st==="short"?x.length+" of 17 characters."
        :"This doesn't pass the VIN check, so a character may be mistyped.";
    }
    $("vVin").addEventListener("input",vinHint);vinHint();
    // Year / make / model dropdowns fill in the name until the person types their own
    var modelWanted=ymm.model,modelReq=0;
    function getMake(){return $("vMake").value==="other"?cleanStr($("vMakeOther").value,40):$("vMake").value}
    function getModel(){return $("vModel").hidden||$("vModel").value==="other"?cleanStr($("vModelOther").value,60):$("vModel").value}
    function autoName(){return [$("vYear").value,getMake(),getModel()].filter(Boolean).join(" ")}
    var nameOwn=!!(v&&v.name&&v.name!==autoName());
    function syncName(){if(!nameOwn)$("vName").value=autoName().slice(0,60)}
    function fillModels(extra){
      var make=getMake(),known=CAR_MAKES[make]?makeModels(make):[],sel=$("vModel"),list=known.slice(),low={};
      known.forEach(function(m){low[m.toLowerCase()]=1});
      (extra||[]).forEach(function(m){if(!low[m.toLowerCase()]){low[m.toLowerCase()]=1;list.push(m)}});
      if(modelWanted&&modelWanted!=="other"&&!low[modelWanted.toLowerCase()]&&CAR_MAKES[make]){$("vModelOther").value=modelWanted;modelWanted="other"}
      list.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
      var listed=$("vMake").value&&$("vMake").value!=="other";
      sel.hidden=!listed;
      sel.innerHTML='<option value="">Model</option>'+list.map(function(m){return '<option'+(m===modelWanted?" selected":"")+'>'+esc(m)+'</option>'}).join("")+'<option value="other"'+(modelWanted==="other"?" selected":"")+'>Other…</option>';
      if(!listed&&modelWanted&&modelWanted!=="other")$("vModelOther").value=modelWanted;
      $("vModelOther").hidden=listed&&sel.value!=="other";
    }
    function refreshModels(){
      fillModels();
      var make=getMake(),year=$("vYear").value,req=++modelReq;
      if(CAR_MAKES[make]&&year)onlineModels(make,year).then(function(list){
        if(req!==modelReq||!list.length)return;
        var cur=$("vModel").value;modelWanted=cur||modelWanted;fillModels(list);
      });
    }
    $("vYear").onchange=function(){refreshModels();syncName()};
    $("vMake").onchange=function(){
      var other=this.value==="other";$("vMakeOther").hidden=!other;
      modelWanted="";$("vModelOther").value="";refreshModels();syncName();
      if(other)$("vMakeOther").focus();
    };
    $("vModel").onchange=function(){
      modelWanted=this.value;var other=this.value==="other";$("vModelOther").hidden=!other;
      if(other)$("vModelOther").focus();syncName();
    };
    $("vMakeOther").addEventListener("input",syncName);
    $("vModelOther").addEventListener("input",syncName);
    $("vName").addEventListener("input",function(){nameOwn=!!this.value.trim()&&this.value.trim()!==autoName()});
    refreshModels();
    if(focusId)setTimeout(function(){var f=$(focusId);if(f){f.scrollIntoView({block:"center"});f.focus()}},60);
    function syncPresets(){var cur=readNum("vInt");Array.prototype.forEach.call(document.querySelectorAll("[data-int]"),function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-int")===cur))})}
    $("vInt").addEventListener("input",syncPresets);
    Array.prototype.forEach.call(document.querySelectorAll("[data-int]"),function(b){b.onclick=function(){$("vInt").value=num(+b.getAttribute("data-int"));syncPresets()}});
    if(!isNew)$("vDelete").onclick=function(){confirmSheet("Delete "+v.name+"?","This removes the vehicle and its whole maintenance history.","Delete vehicle",function(){
      data.vehicles=data.vehicles.filter(function(x){return x.id!==v.id});save();go("home");toast("Vehicle deleted")},true)};
    $("vForm").onsubmit=function(e){
      e.preventDefault();
      var err=$("vErr"),name=$("vName").value.trim(),miles=readNum("vMiles"),iv=readNum("vInt"),mon=+$("vMon").value;
      function fail(m){err.textContent=m;err.hidden=false}
      if(!name)name=autoName();
      if(!name)return fail("Choose the year, make and model, or type a name for the vehicle.");
      if(!(iv>=500&&iv<=50000))return fail("Enter how many "+unit()+" between oil changes, between 500 and 50,000.");
      if($("vMiles").value.trim()&&!(miles>=0&&miles<10000000))return fail("Enter the current mileage as a number.");
      var hasRot=isNew&&!!$("vRotDate");
      var rotDate=hasRot?$("vRotDate").value:"",rotMilesRaw=hasRot?$("vRotMiles").value.trim():"",rotMiles=hasRot?readNum("vRotMiles"):NaN;
      if(hasRot&&(rotDate||rotMilesRaw)){
        if(!parse(rotDate))return fail("Add the date of the last tire rotation too.");
        if(parse(rotDate)>today())return fail("The last tire rotation can't be in the future.");
        if(rotMilesRaw&&!(rotMiles>=0))return fail("Enter the tire rotation mileage as a number.");
      }
      var lastDate=isNew?$("vLastDate").value:"",lastMiles=isNew?readNum("vLastMiles"):NaN;
      if(isNew&&(lastDate||$("vLastMiles").value.trim())){
        if(!parse(lastDate))return fail("Add the date of the last oil change too.");
        if(!(lastMiles>=0))return fail("Add the mileage at the last oil change too.");
        if(parse(lastDate)>today())return fail("The last oil change can't be in the future.");
      }
      var regExp=$("vRegExp").value;
      if(regExp&&!parse(regExp))return fail("Choose the registration expiry date, or leave it blank.");
      var target=v||{id:uid(),log:[],services:[]};
      var newVin=vinClean($("vVin").value);
      if(newVin!==target.vin){target.vin=newVin;target.specs=null;target.recalls=null}
      target.reg={number:$("vRegNo").value.trim().toUpperCase().slice(0,20),state:$("vRegState").value.trim().slice(0,30),expires:regExp};
      target.year=$("vYear").value;target.make=getMake();target.model=getModel();
      target.name=name.slice(0,60);target.plate=$("vPlate").value.trim().slice(0,60);
      target.intervalMiles=iv;target.intervalMonths=mon;target.look=$("vLook").value;
      if(hasRot&&parse(rotDate))target.services.push({id:uid(),type:"Tire rotation",date:rotDate,miles:rotMilesRaw?rotMiles:null,note:""});
      if(!isNaN(miles)&&miles!==target.miles){target.miles=miles;target.milesDate=iso(today())}
      if(isNew&&parse(lastDate))target.log.push({id:uid(),date:lastDate,miles:lastMiles,note:""});
      if(isNew){if(data.example){data.vehicles=[];data.example=false}data.vehicles.push(target)}
      save();closeSheet();
      if(isNew){go("vehicle",target.id);toast("Vehicle added")}else{render();toast("Saved")}
    };
  });
}

function logSheet(v){
  var cur=currentMiles(v);
  var h='<h2 id="sheetTitle">Log oil change</h2><p class="hint" style="margin-top:-8px">'+esc(v.name)+'</p>'+
    '<form id="lForm" novalidate><div style="display:flex;flex-direction:column;gap:14px">'+
    '<div class="two"><div class="field"><label for="lDate">Date</label><input id="lDate" type="date" value="'+iso(today())+'" max="'+iso(today())+'"></div>'+
    '<div class="field"><label for="lMiles">Mileage ('+unit()+')</label><input id="lMiles" inputmode="numeric" placeholder="'+(cur?num(cur):"e.g. 46,850")+'"></div></div>'+
    '<div class="field"><label for="lNote">Notes (optional)</label><input id="lNote" maxlength="200" autocomplete="off" placeholder="e.g. 0W-20 synthetic, new filter, Jiffy Lube"></div>'+
    '<div class="preview" id="lPrev" aria-live="polite"></div>'+
    '<p class="err" id="lErr" hidden></p>'+
    '<div class="sheet-btns"><button class="btn" type="button" id="lCancel">Cancel</button><button class="btn primary" type="submit">Save oil change</button></div>'+
    '</div></form>';
  openSheet(h,function(){
    $("lCancel").onclick=closeSheet;
    function prev(){
      var d=parse($("lDate").value),m=readNum("lMiles");
      $("lPrev").innerHTML=(d&&m>=0)?'Next oil change at <b>'+num(m+v.intervalMiles)+' '+unit()+'</b> or by <b>'+esc(fmtDate(addMonths(d,v.intervalMonths)))+'</b>, whichever comes first.'
        :'Enter the date and mileage to see when the next oil change is due.';
    }
    $("lDate").addEventListener("input",prev);$("lMiles").addEventListener("input",prev);prev();
    $("lForm").onsubmit=function(e){
      e.preventDefault();
      var err=$("lErr"),d=$("lDate").value,m=readNum("lMiles");
      function fail(x){err.textContent=x;err.hidden=false}
      if(!parse(d))return fail("Choose the date of the oil change.");
      if(parse(d)>today())return fail("The date can't be in the future.");
      if(!(m>=0&&m<10000000))return fail("Enter the mileage from the odometer.");
      v.log.push({id:uid(),date:d,miles:m,note:$("lNote").value.trim().slice(0,200)});
      if(m>(v.miles||0)){v.miles=m;v.milesDate=d}
      if(data.example)data.example=false;
      save();closeSheet();render();
      var s=status(v);toast("Saved. Next due at "+num(s.dueMiles)+" "+unit()+" or "+fmtDate(s.dueDate));
    };
  });
}

function serviceSheet(v,pre){
  var cur=currentMiles(v);
  var h='<h2 id="sheetTitle">Add maintenance</h2><p class="hint" style="margin-top:-8px">'+esc(v.name)+'</p>'+
    '<form id="sForm" novalidate><div style="display:flex;flex-direction:column;gap:14px">'+
    '<div class="field"><span class="lbl">What was done? Pick all that apply.</span><div class="presets" id="sTypes">'+
      SERVICE_TYPES.concat(data.custom).map(function(t){return '<button class="preset" type="button" data-type="'+esc(t)+'" aria-pressed="'+(t===pre)+'">'+esc(t)+'</button>'}).join("")+
      '<button class="preset" type="button" data-type="" id="sOtherBtn" aria-pressed="false">Other…</button></div></div>'+
    '<div class="field" id="sOtherWrap" hidden><label for="sOther">Other maintenance</label><input id="sOther" maxlength="40" autocomplete="off" placeholder="e.g. Alternator, spark plugs"><label class="check"><input type="checkbox" id="sSave" checked> Add to my parts list for next time</label></div>'+
    '<div class="two"><div class="field"><label for="sDate">Date</label><input id="sDate" type="date" value="'+iso(today())+'" max="'+iso(today())+'"></div>'+
    '<div class="field"><label for="sMiles">Mileage (optional)</label><input id="sMiles" inputmode="numeric" placeholder="'+(cur?num(cur):"e.g. 46,850")+'"></div></div>'+
    '<div class="field"><label for="sNote">Notes (optional)</label><input id="sNote" maxlength="200" autocomplete="off" placeholder="e.g. Brand, part number, shop, cost"></div>'+
    '<p class="err" id="sErr" hidden></p>'+
    '<div class="sheet-btns"><button class="btn" type="button" id="sCancel">Cancel</button><button class="btn primary" type="submit">Save</button></div>'+
    '</div></form>';
  openSheet(h,function(){
    $("sCancel").onclick=closeSheet;
    Array.prototype.forEach.call(document.querySelectorAll("#sTypes .preset"),function(b){b.onclick=function(){
      var on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));$("sErr").hidden=true;
      if(b.id==="sOtherBtn"){$("sOtherWrap").hidden=!on;if(on)$("sOther").focus()}
    }});
    $("sForm").onsubmit=function(e){
      e.preventDefault();
      var err=$("sErr"),d=$("sDate").value,mRaw=$("sMiles").value.trim(),m=readNum("sMiles");
      function fail(x){err.textContent=x;err.hidden=false}
      var types=[];
      Array.prototype.forEach.call(document.querySelectorAll('#sTypes .preset[aria-pressed="true"]'),function(b){
        if(b.id==="sOtherBtn"){var o=$("sOther").value.trim();if(o)types.push(o.slice(0,40))}else types.push(b.getAttribute("data-type"));
      });
      if($("sOtherBtn").getAttribute("aria-pressed")==="true"&&!$("sOther").value.trim())return fail("Type what the other maintenance was.");
      if(!types.length)return fail("Pick what was done, like Tire rotation or Battery replacement.");
      if(!parse(d))return fail("Choose the date it was done.");
      if(parse(d)>today())return fail("The date can't be in the future.");
      if(mRaw&&!(m>=0&&m<10000000))return fail("Enter the mileage as a number, or leave it blank.");
      var other=$("sOtherBtn").getAttribute("aria-pressed")==="true"?$("sOther").value.trim().slice(0,40):"";
      if(other){
        // match an existing name so history and reminders stay together
        var known=SERVICE_TYPES.concat(data.custom).filter(function(t){return sameName(t,other)})[0];
        if(known){types[types.indexOf(other)]=known}
        else if($("sSave").checked)addCustom(other);
      }
      types=types.filter(function(t,i){return types.indexOf(t)===i});
      types.forEach(function(t){v.services.push({id:uid(),type:t,date:d,miles:mRaw?m:null,note:$("sNote").value.trim().slice(0,200)})});
      if(mRaw&&m>(v.miles||0)){v.miles=m;v.milesDate=d}
      if(data.example)data.example=false;
      save();closeSheet();render();
      // if this restarts a reminder, say when the next one is due
      var hit=active(v).filter(function(x){return !x.def.oil&&x.s.state!=="none"&&x.s.last.date===d&&[x.def.type].concat(x.def.also||[]).some(function(t){return types.indexOf(t)>=0})})[0];
      if(hit)toast("Saved. Next "+hit.def.type.toLowerCase()+" "+(hit.s.dueMiles!=null?"at "+num(hit.s.dueMiles)+" "+unit()+" or ":"")+"by "+fmtDate(hit.s.dueDate));
      else toast(types.length===1?types[0]+" saved":types.length+" items saved");
    };
  });
}

function milesSheet(v){
  var cur=currentMiles(v);
  openSheet('<h2 id="sheetTitle">Update mileage</h2><p class="hint" style="margin-top:-8px">'+esc(v.name)+'</p>'+
    '<form id="mForm" novalidate><div style="display:flex;flex-direction:column;gap:14px">'+
    '<div class="field"><label for="mMiles">Odometer now ('+unit()+')</label><input id="mMiles" inputmode="numeric" value="'+(cur?num(cur):"")+'"></div>'+
    '<p class="hint">Keeping this current tells the tracker how many '+unit()+' you have left before the next oil change.</p>'+
    '<p class="err" id="mErr" hidden></p>'+
    '<div class="sheet-btns"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="submit">Save mileage</button></div>'+
    '</div></form>',function(){
      $("mCancel").onclick=closeSheet;
      var inp=$("mMiles");inp.addEventListener("focus",function(){inp.select()});
      $("mForm").onsubmit=function(e){
        e.preventDefault();
        var m=readNum("mMiles"),err=$("mErr");
        if(!(m>=0&&m<10000000)){err.textContent="Enter the mileage from the odometer.";err.hidden=false;return}
        var last=sortedLog(v)[0];
        if(last&&m<last.miles){err.textContent="That's lower than the "+num(last.miles)+" "+unit()+" at the last oil change. Check the number, or edit the oil change history.";err.hidden=false;return}
        v.miles=m;v.milesDate=iso(today());save();closeSheet();render();toast("Mileage updated");
      };
    });
}

/* keep in sync with other tabs and roll statuses over at midnight */
window.addEventListener("storage",function(e){if(e.key===KEY&&e.newValue){try{var c=clean(JSON.parse(e.newValue));if(c){data=c;if(!$("scrim"))render()}}catch(x){}}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!$("scrim"))render()});

/* ---------- installable app ---------- */
// Chrome and Edge on Android offer an install prompt; keep it for the Install button
var installEvent=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvent=e;if(!$("scrim"))render()});
window.addEventListener("appinstalled",function(){installEvent=null;data.homeTipOff=true;save();if(!$("scrim"))render();toast("Installed. Open it from your Home Screen.")});
function installApp(){
  if(!installEvent)return;
  installEvent.prompt();
  installEvent.userChoice.then(function(){installEvent=null;render()},function(){});
}
// number on the Home Screen icon: vehicles that are due soon or overdue
function updateBadge(){
  try{
    if(!navigator.setAppBadge)return;
    var n=data.example?0:data.vehicles.filter(function(v){var o=overall(v);return o==="late"||o==="soon"}).length;
    (n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(function(){});
  }catch(e){}
}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!inViewer()){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}

render();
})();
</script>
</body>
